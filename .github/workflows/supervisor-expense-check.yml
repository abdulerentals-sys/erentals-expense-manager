name: Supervisor expense verification
on:
  push:
    branches: [supervisor-expense]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/supervisor-expense-contract.test.mjs
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint-output.txt 2>&1
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-expense-lint
          path: lint-output.txt
      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - name: Netlify build
        id: build
        continue-on-error: true
        run: npm run build:netlify > build-output.txt 2>&1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-expense-build
          path: build-output.txt
      - name: Fail on build errors
        if: steps.build.outcome == 'failure'
        run: exit 1
