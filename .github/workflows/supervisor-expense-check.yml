name: Supervisor expense verification
on:
  push:
    branches: [supervisor-expense]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/supervisor-expense-contract.test.mjs
      - run: npm run lint
      - run: npm run build:netlify
