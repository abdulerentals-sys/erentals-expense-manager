name: Supervisor expense verification
on:
  push:
    branches: [supervisor-expense]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/supervisor-expense-contract.test.mjs
      - name: Lint
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1
          status=$?
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lint-output.txt
          git diff --cached --quiet || git commit -m "[lint-debug] capture lint output"
          git push
          exit $status
      - run: npm run build:netlify
